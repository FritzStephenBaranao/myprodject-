<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Fitness Tracker</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-bg">

    <div class="container d-flex justify-content-center align-items-center min-vh-100 py-4">
        <div class="card custom-card shadow-lg" style="max-width: 450px; width: 100%;">
            <div class="card-header bg-primary text-white text-center py-4">
                <h2 class="mb-0">Fitness Tracker</h2>
                <p class="mb-0 small">Create your account</p>
            </div>
            
            <div class="card-body p-4">
                <div id="signupFeedback"></div>

                <form id="signupForm">
                    <!-- Full Name -->
                    <div class="mb-3">
                        <label for="fullName" class="form-label">Full Name</label>
                        <input type="text" class="form-control" id="fullName" placeholder="John Doe" required>
                    </div>

                    <!-- Username -->
                    <div class="mb-3">
                        <label for="username" class="form-label">Username</label>
                        <input type="text" class="form-control" id="username" placeholder="Choose a username" required>
                    </div>

                    <!-- Password -->
                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" placeholder="At least 6 characters" required>
                    </div>

                    <!-- Confirm Password -->
                    <div class="mb-3">
                        <label for="confirmPassword" class="form-label">Confirm Password</label>
                        <input type="password" class="form-control" id="confirmPassword" placeholder="Repeat password" required>
                    </div>

                    <!-- Submit Button -->
                    <button type="button" class="btn btn-primary w-100 py-2" id="signupBtn">Sign Up</button>
                </form>

                <!-- Navigation link to Go Back to Login -->
                <div class="text-center mt-3 pt-2 border-top">
                    <p class="mb-1 text-muted">Already registered?</p>
                    <a href="index.html" class="btn btn-outline-secondary btn-sm w-100 fw-bold">← Back to Login</a>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script src="js/signup.js"></script>
</body>
</html>
