<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Fitness Tracker</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-bg">

    <div class="container d-flex justify-content-center align-items-center min-vh-100 py-4">
        <div class="card custom-card shadow-lg" style="max-width: 400px; width: 100%;">
            <div class="card-header bg-primary text-white text-center py-4">
                <h2 class="mb-0">Fitness Tracker</h2>
                <p class="mb-0 small">Login to your dashboard</p>
            </div>
            
            <div class="card-body p-4">
                <div id="loginFeedback"></div>

                <form id="loginForm">
                    <!-- Username Input -->
                    <div class="mb-3">
                        <label for="username" class="form-label">Username</label>
                        <input type="text" class="form-control" id="username" placeholder="Enter username" required>
                    </div>

                    <!-- Password Input -->
                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" placeholder="Enter password" required>
                    </div>

                    <!-- Remember Me -->
                    <div class="mb-3 form-check">
                        <input type="checkbox" class="form-check-input" id="rememberMe">
                        <label class="form-check-label" for="rememberMe">Remember Me</label>
                    </div>

                    <!-- Login Button -->
                    <button type="button" class="btn btn-primary w-100 py-2" id="loginBtn">Login</button>
                </form>

                <!-- Link to Sign Up -->
                <div class="text-center mt-3 pt-2 border-top">
                    <p class="mb-1 text-muted">Don't have an account?</p>
                    <a href="signup.html" class="btn btn-outline-primary btn-sm w-100 fw-bold">Create New Account (Sign Up)</a>
                </div>

                <div class="text-center mt-3 pt-2 border-top">
                    <small class="text-muted">Default admin: admin / password123</small>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script src="js/login.js"></script>
</body>
</html>
