<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - Fitness Tracker</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      background-color: #f8f9fa;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .card {
      width: 380px;
      background: #ffffff;
      border-radius: 8px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
      overflow: hidden;
    }

    .card-header {
      background-color: #0d6efd;
      color: #ffffff;
      text-align: center;
      padding: 28px 20px;
    }

    .card-header h1 {
      font-size: 26px;
      font-weight: bold;
      margin-bottom: 6px;
    }

    .card-header p {
      font-size: 13px;
    }

    .card-body {
      padding: 24px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      color: #333;
      margin-bottom: 6px;
    }

    .form-group input[type="text"],
    .form-group input[type="password"] {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid #ced4da;
      border-radius: 4px;
      font-size: 13px;
      outline: none;
    }

    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 18px;
    }

    .checkbox-group label {
      font-size: 13px;
      color: #333;
    }

    .btn-blue {
      width: 100%;
      background-color: #0d6efd;
      color: #ffffff;
      border: none;
      padding: 10px;
      font-size: 14px;
      border-radius: 4px;
      cursor: pointer;
    }

    .divider-text {
      text-align: center;
      font-size: 12px;
      color: #6c757d;
      margin: 16px 0 12px;
    }

    .btn-outline {
      width: 100%;
      background-color: transparent;
      color: #0d6efd;
      border: 1px solid #0d6efd;
      padding: 8px;
      font-size: 13px;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
    }

    .footer-text {
      text-align: center;
      font-size: 12px;
      color: #6c757d;
      margin-top: 20px;
    }

    .hidden {
      display: none;
    }

    .msg-box {
      text-align: center;
      padding: 10px 0;
    }

    .msg-box p {
      font-size: 15px;
      margin-bottom: 20px;
      color: #333;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="card-header">
      <h1>Fitness Tracker</h1>
      <p id="header-subtitle">Login to your dashboard</p>
    </div>

    <div class="card-body">
      
      <!-- LOGIN VIEW -->
      <form id="login-form" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label>Username</label>
          <input type="text" id="login-user" placeholder="Enter username" required />
        </div>

        <div class="form-group">
          <label>Password</label>
          <input type="password" id="login-pass" placeholder="Enter password" required />
        </div>

        <div class="checkbox-group">
          <input type="checkbox" id="remember" />
          <label for="remember">Remember Me</label>
        </div>

        <button type="submit" class="btn-blue">Login</button>

        <div class="divider-text">Don't have an account?</div>

        <button type="button" class="btn-outline" onclick="showSignup()">Create New Account (Sign Up)</button>

        <div class="footer-text">Default admin: admin / password123</div>
      </form>

      <!-- SIGN UP VIEW -->
      <form id="signup-form" class="hidden" onsubmit="handleSignup(event)">
        <div class="form-group">
          <label>Username</label>
          <input type="text" id="signup-user" placeholder="Enter username" required />
        </div>

        <div class="form-group">
          <label>Password</label>
          <input type="password" id="signup-pass" placeholder="Enter password" required />
        </div>

        <button type="submit" class="btn-blue" style="margin-bottom: 12px;">Sign Up</button>
        <button type="button" class="btn-outline" onclick="showLogin()">Back to Option</button>
      </form>

      <!-- SUCCESS VIEW -->
      <div id="success-view" class="hidden msg-box">
        <p id="success-message"></p>
        <button type="button" class="btn-outline" onclick="showLogin()">Back to Option</button>
      </div>

    </div>
  </div>

  <script>
    const loginForm = document.getElementById('login-form');
    const signupForm = document.getElementById('signup-form');
    const successView = document.getElementById('success-view');
    const successMessage = document.getElementById('success-message');
    const headerSubtitle = document.getElementById('header-subtitle');

    function showLogin() {
      headerSubtitle.textContent = 'Login to your dashboard';
      loginForm.classList.remove('hidden');
      signupForm.classList.add('hidden');
      successView.classList.add('hidden');
    }

    function showSignup() {
      headerSubtitle.textContent = 'Create New Account';
      loginForm.classList.add('hidden');
      signupForm.classList.remove('hidden');
      successView.classList.add('hidden');
    }

    function handleLogin(e) {
      e.preventDefault();
      loginForm.classList.add('hidden');
      successView.classList.remove('hidden');
      successMessage.textContent = 'Log In Successful!';
    }

    function handleSignup(e) {
      e.preventDefault();
      signupForm.classList.add('hidden');
      successView.classList.remove('hidden');
      successMessage.textContent = 'Sign Up Successful!';
    }
  </script>

</body>
</html>
